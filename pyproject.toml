[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upf-digital-twin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "pyyaml", "scikit-learn", "torch", "pyarrow",
  "boto3",          # only if NDT reads S3 directly
  "s3fs",           # optional, if you use pandas/pyarrow with s3://
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]    # if your code lives in src/upf_digital_twin/, otherwise drop this section
