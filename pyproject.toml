[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upf-digital-twin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  # Pinned: the shipped surrogate .pkl artifacts are coupled to scikit-learn's
  # pickle format. 1.8.x loads them; 1.9 removed an internal (_loss) and fails.
  "scikit-learn>=1.8,<1.9",
  "joblib",
  "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
dashboard = ["streamlit", "plotly"]
s3  = ["boto3", "s3fs"]

[tool.setuptools.packages.find]
where   = ["src"]
include = ["upf_digital_twin*"]
