[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upf-digital-twin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "torch",
  "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
s3  = ["boto3", "s3fs"]

[tool.setuptools.packages.find]
where   = ["src"]
include = ["upf_digital_twin*"]
