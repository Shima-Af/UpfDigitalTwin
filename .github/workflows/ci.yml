name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked deps + package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Test (pytest)
        # The data is DVC-tracked and not available in CI, so the integration
        # tests in tests/test_integration_twin.py skip automatically. The rest
        # of the suite is hermetic.
        run: pytest

# Optional: to also run the data-backed checks (smoke test + demo) in CI, add a
# second job that configures AWS credentials from repository secrets and runs
# `dvc pull` before `python scripts/smoke_test_artifacts.py`. Gate it on the
# secret being present so forks without credentials stay green.
